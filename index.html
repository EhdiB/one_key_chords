<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One-Key Chords</title>
<style>
:root{--page1:#fafafd;--page2:#e8e8ec;--text:#1d1d1f;--muted:#6e6e73;--active:#d8e8ff;--control:#fff;--keyboard1:#dedee2;--keyboard2:#c8c8cc;--key1:#fff;--key2:#f3f3f5;--keyborder:#b5b5ba;--shadow:#0003;--frameborder:#aaa}
html[data-theme="dark"]{--page1:#17181c;--page2:#0d0e11;--text:#f5f5f7;--muted:#a1a1a6;--active:#263d5f;--control:#24252a;--keyboard1:#3a3b40;--keyboard2:#292a2e;--key1:#55565b;--key2:#45464b;--keyborder:#202126;--shadow:#0008;--frameborder:#17181c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:38px 20px 50px;background:linear-gradient(var(--page1),var(--page2));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:var(--text)}
.app{max-width:1080px;margin:auto}
h1{font-size:clamp(2.3rem,5vw,4rem);letter-spacing:-.055em;margin:0}
.sub{color:var(--muted);font-size:1.08rem;margin:6px 0 28px}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:15px;border-radius:18px;background:var(--control);border:1px solid var(--frameborder);box-shadow:0 10px 35px var(--shadow);margin-bottom:28px}
label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.82rem;font-weight:600}
select,button{font:inherit;padding:8px 11px;border:1px solid var(--keyborder);border-radius:9px;background:var(--control);color:var(--text)}
button{cursor:pointer}
.status{margin-left:auto;color:var(--muted);font-size:.88rem}

.keyboard{
  width:100%;
  padding:26px 25px 30px;
  border-radius:22px;
  background:linear-gradient(145deg,var(--keyboard1),var(--keyboard2));
  border:1px solid var(--frameborder);
  box-shadow:0 28px 50px var(--shadow),inset 0 1px #ffffff66;
  overflow:hidden;
}
.row{
  display:flex;
  gap:8px;
  width:max-content;
  margin-bottom:9px;
}
.row:nth-child(1){margin-left:0}
.row:nth-child(2){margin-left:3.2%}
.row:nth-child(3){margin-left:6.2%}
.row:last-child{margin-bottom:0}

.key{
  flex:0 0 118px;
  width:118px;
  height:76px;
  border-radius:8px;
  border:1px solid var(--keyborder);
  background:linear-gradient(var(--key1),var(--key2));
  box-shadow:0 2px 0 #777,0 4px 7px var(--shadow),inset 0 1px #ffffff88;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px 7px 9px;
  cursor:pointer;
  user-select:none;
  transition:transform .045s,box-shadow .045s,background .045s;
}
.key:hover{background:linear-gradient(var(--key1),var(--key2))}
.key.active{transform:translateY(2px);background:linear-gradient(var(--active),#b9d1f5);border-color:#79a9ee;box-shadow:0 0 0 #999,inset 0 1px #fff}
.keycap{align-self:flex-start;font-size:13px;font-weight:650;color:#3a3a3c}
.chord{margin-top:auto;font-size:clamp(.95rem,2vw,1.25rem);font-weight:700;letter-spacing:-.025em}
.roman{font-size:.67rem;color:#888}

.legend{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:18px 0;color:var(--muted);font-size:.88rem}
.pill{padding:2px 7px;border:1px solid var(--keyborder);border-bottom-width:2px;border-radius:5px;background:var(--control);color:var(--text);font-size:.76rem;font-weight:650}
.footer{text-align:center;color:var(--muted);font-size:.85rem}

@media(max-width:1000px){
  .key{flex-basis:calc((min(100vw - 90px,1080px) - 100px) / 7);width:calc((min(100vw - 90px,1080px) - 100px) / 7)}
}
@media(max-width:700px){
  body{padding:22px 9px}
  .keyboard{padding:14px 9px 17px;border-radius:15px}
  .row{gap:4px;margin-bottom:5px}
  .row:nth-child(2){margin-left:2.5%}
  .row:nth-child(3){margin-left:4.5%}
  .key{flex-basis:calc((100vw - 50px)/7);width:calc((100vw - 50px)/7);height:60px;border-radius:6px;padding:5px 3px 6px}
  .keycap{font-size:10px}
  .chord{font-size:.72rem}
  .roman{font-size:.5rem}
  .status{width:100%;margin-left:0}
}
</style>
<style id="themeStyles">
body.light-mode{background:linear-gradient(#fafafd,#e8e8ec)!important;color:#1d1d1f!important}
body.dark-mode{background:linear-gradient(#17181c,#0d0e11)!important;color:#f5f5f7!important}
body.dark-mode .sub,body.dark-mode .status,body.dark-mode .legend,body.dark-mode .footer{color:#a1a1a6!important}
body.dark-mode .controls{background:#24252a!important;border-color:#44454b!important;box-shadow:0 10px 35px #0008!important}
body.dark-mode select,body.dark-mode button{background:#303137!important;color:#f5f5f7!important;border-color:#55565d!important}
body.dark-mode .keyboard{background:linear-gradient(145deg,#3a3b40,#292a2e)!important;border-color:#17181c!important;box-shadow:0 28px 50px #0008,inset 0 1px #ffffff22!important}
body.dark-mode .key{background:linear-gradient(#55565b,#45464b)!important;border-color:#202126!important;box-shadow:0 2px 0 #17181c,0 4px 7px #0008,inset 0 1px #ffffff22!important}
body.dark-mode .key:hover{background:linear-gradient(#626369,#4d4e53)!important}
body.dark-mode .key.active{background:linear-gradient(#496b9e,#344f77)!important;border-color:#8ab4f8!important}
body.dark-mode .keycap,body.dark-mode .chord,body.dark-mode .roman{color:#f5f5f7!important}
body.dark-mode .roman{opacity:.7}
body.dark-mode .pill{background:#303137!important;color:#f5f5f7!important;border-color:#55565d!important}
</style><style>
body.fullscreen{
  min-height:100vh;
  padding:5vh 4vw;
  display:flex;
  align-items:center;
  justify-content:center;
}
body.fullscreen .app{
  width:min(1250px,94vw);
  max-width:1250px;
  margin:auto;
}
body.fullscreen .keyboard{
  margin-left:auto;
  margin-right:auto;
}
body.fullscreen h1,
body.fullscreen .sub,
body.fullscreen .controls,
body.fullscreen .legend,
body.fullscreen .footer{
  display:block;
}
</style></head>
<body class="light-mode"><div class="app">
<h1>One-Key Chords</h1><p class="sub">Play complete chords with a single key.</p>
<div class="controls">
<label>Key<select id="keySelect"><option>C</option><option>C#</option><option>D</option><option>Eb</option><option>E</option><option>F</option><option>F#</option><option>G</option><option>Ab</option><option>A</option><option>Bb</option><option>B</option></select></label>
<label>Octave<select id="octaveSelect"><option value="3">Low</option><option value="4" selected>Middle</option><option value="5">High</option></select></label>
<label>Sustain<select id="sustainSelect"><option value="0" selected>Hold key</option><option value="1.8">Short</option><option value="4">Long</option></select></label>
<label>Chord flavor<select id="flavorSelect">
<option value="basic" selected>Basic</option>
<option value="sus4">Sus 4</option>
<option value="sus2">Sus 2</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="maj7">Maj 7</option>
<option value="9">9</option>
</select></label>
<label>Sound<select id="soundSelect">
<option value="piano" selected>Acoustic Piano</option>
<option value="softPiano">Soft Piano</option>
<option value="rhodes">Rhodes</option>
<option value="fm">FM Piano</option>
<option value="organ">Organ</option>
<option value="pad">Ambient Pad</option>
<option value="vibes">Vibraphone</option>
<option value="strings">Strings</option>
</select></label>
<label>Preset<select id="presetSelect">
<option value="none" selected>Custom / Basic</option>
<option value="pop">Pop</option>
<option value="dreamy">Dreamy</option>
<option value="jazz">Jazz</option>
<option value="rock">Rock</option>
</select></label>
<label>Voicing<select id="voicingSelect"><option value="close" selected>Close</option><option value="open">Open</option><option value="wide">Wide</option><option value="auto">Auto</option></select></label><button id="stopBtn">Stop</button><button id="themeBtn" title="Toggle light/dark mode">☾ Dark</button><button id="fullscreenBtn" title="Toggle full screen">⛶ Full Screen</button><div class="status" id="status">Click anywhere to activate sound.</div>
</div>
<div class="keyboard" id="keyboard"></div>
<div class="legend"><span class="pill">Q–U</span> variants &nbsp; <span class="pill">A–J</span> diatonic chords &nbsp; <span class="pill">Z–M</span> seventh chords &nbsp; <span class="pill">Flavor</span> recolors the whole keyboard</div>
<div class="footer">Use your computer keyboard or click the keys.</div>
</div>
<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
let ctx = null;
const NI={C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11};
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const SC=[0,2,4,5,7,9,11];
const rows=[['q','w','e','r','t','y','u'],['a','s','d','f','g','h','j'],['z','x','c','v','b','n','m']];
const map={
 q:[0,'minor'],w:[1,'major'],e:[2,'major'],r:[3,'minor'],t:[4,'minor'],y:[5,'major'],u:[6,'major'],
 a:[0,'dia'],s:[1,'dia'],d:[2,'dia'],f:[3,'dia'],g:[4,'dia'],h:[5,'dia'],j:[6,'dia'],
 z:[0,'maj7'],x:[1,'min7'],c:[2,'min7'],v:[3,'maj7'],b:[4,'dom7'],n:[5,'min7'],m:[6,'hdim7']
};
const romanByType={q:'i',w:'II',e:'III',r:'iv',t:'v',y:'VI',u:'VII',
 a:'I',s:'ii',d:'iii',f:'IV',g:'V',h:'vi',j:'vii°',
 z:'Imaj7',x:'ii7',c:'iii7',v:'IVmaj7',b:'V7',n:'vi7',m:'viiø7'};
const active=new Map();

function ensureAudio(){
  if(!ctx) ctx=new AudioContext();
  if(ctx.state==='suspended') return ctx.resume();
  return Promise.resolve();
}
function flats(k){return k.includes('b')||['F','Bb','Eb','Ab'].includes(k)}
function rootMidi(deg){
  const k=document.getElementById('keySelect').value;
  const o=+document.getElementById('octaveSelect').value;
  return 12*(o+1)+NI[k]+SC[deg];
}
function baseIntervals(deg,type){
  if(type==='dia') return deg===6?[0,3,6]:[0,[1,2,5].includes(deg)?3:4,7];
  if(type==='major')return[0,4,7];
  if(type==='minor')return[0,3,7];
  if(type==='maj7')return[0,4,7,11];
  if(type==='min7')return[0,3,7,10];
  if(type==='dom7')return[0,4,7,10];
  return[0,3,6,10];
}
function flavorForKey(key){
  const p=document.getElementById('presetSelect').value;
  if(p==='none') return document.getElementById('flavorSelect').value;
  if(p==='pop') return ({a:'maj7',s:'min7',d:'min7',f:'maj7',g:'dom7',h:'min7',j:'hdim7'})[key]||'basic';
  if(p==='dreamy') return ({a:'maj7',s:'min7',d:'min7',f:'maj7',g:'sus4',h:'min7',j:'hdim7'})[key]||'basic';
  if(p==='jazz') return ({a:'maj7',s:'min9',d:'min9',f:'maj7',g:'dom9',h:'min9',j:'hdim7'})[key]||'basic';
  if(p==='rock') return ({a:'basic',s:'sus4',d:'basic',f:'sus4',g:'dom7',h:'basic',j:'hdim7'})[key]||'basic';
  return 'basic';
}
function intervals(deg,type,flavor){
  if(!flavor||flavor==='basic') return baseIntervals(deg,type);
  if(flavor==='sus4')return[0,5,7];
  if(flavor==='sus2')return[0,2,7];
  if(flavor==='6')return(type==='minor'||type==='min7')?[0,3,7,9]:[0,4,7,9];
  if(flavor==='7'||flavor==='dom7')return[0,4,7,10];
  if(flavor==='maj7')return[0,4,7,11];
  if(flavor==='9'||flavor==='dom9')return[0,4,7,10,14];
  if(flavor==='min7')return[0,3,7,10];
  if(flavor==='min9')return[0,3,7,10,14];
  if(flavor==='hdim7')return[0,3,6,10];
  return baseIntervals(deg,type);
}
function chordName(deg,type,key){
  const k=document.getElementById('keySelect').value;
  const n=(flats(k)?FL:SH)[(NI[k]+SC[deg])%12];
  const f=flavorForKey(key);
  if(f==='sus4')return n+'sus4';
  if(f==='sus2')return n+'sus2';
  if(f==='6')return n+(type==='minor'||type==='min7'?'m6':'6');
  if(f==='7'||f==='dom7')return n+'7';
  if(f==='maj7')return n+'maj7';
  if(f==='9'||f==='dom9')return n+'9';
  if(f==='min7')return n+'m7';
  if(f==='min9')return n+'m9';
  if(f==='hdim7')return n+'m7♭5';
  if(type==='dia')return n+(deg===6?'dim':([1,2,5].includes(deg)?'m':''));
  if(type==='major')return n;
  if(type==='minor')return n+'m';
  if(type==='maj7')return n+'maj7';
  if(type==='min7')return n+'m7';
  if(type==='dom7')return n+'7';
  return n+'m7♭5';
}
function freq(m){return 440*Math.pow(2,(m-69)/12)}

function voicedIntervals(raw){
  const mode=document.getElementById('voicingSelect').value;
  if(mode==='close') return raw;
  if(mode==='open') return raw.map((x,i)=>i===1?x+12:x);
  if(mode==='wide') return raw.map((x,i)=>i===1?x+12:(i>=2?x+24:x));
  if(mode==='auto'){
    const prev=window.lastVoicingCenter;
    const candidates=[];
    for(let shift=-12;shift<=12;shift+=12){
      const arr=raw.map(x=>x+shift);
      const center=(arr[0]+arr[arr.length-1])/2;
      const spread=arr[arr.length-1]-arr[0];
      candidates.push({arr,score:Math.abs((prev??60)-center)+spread*.08});
    }
    candidates.sort((a,b)=>a.score-b.score);
    const chosen=candidates[0].arr;
    window.lastVoicingCenter=(chosen[0]+chosen[chosen.length-1])/2;
    return chosen;
  }
  return raw;
}
function makeVoice(f,gain=.08){
  const sound=document.getElementById('soundSelect').value;
  const now=ctx.currentTime;
  const master=ctx.createGain();
  const filter=ctx.createBiquadFilter();
  const os=[];

  let attack=.015, release=.3, filterFreq=3200;
  if(sound==='softPiano'){attack=.035;release=.55;filterFreq=2100}
  if(sound==='rhodes'){attack=.025;release=.8;filterFreq=2400}
  if(sound==='fm'){attack=.012;release=.5;filterFreq=4200}
  if(sound==='organ'){attack=.08;release=.12;filterFreq=5000}
  if(sound==='pad'){attack=.45;release=1.2;filterFreq=1800}
  if(sound==='vibes'){attack=.02;release=1.4;filterFreq=5000}
  if(sound==='strings'){attack=.35;release=1.4;filterFreq=2800}

  master.gain.setValueAtTime(.0001,now);
  master.gain.exponentialRampToValueAtTime(gain,now+attack);
  master.gain.exponentialRampToValueAtTime(gain*.42,now+attack+Math.max(.18,release*.35));

  filter.type='lowpass';
  filter.frequency.value=filterFreq;
  filter.Q.value=.7;
  master.connect(filter);
  filter.connect(ctx.destination);

  function addOsc(type,mult,level,detune=0){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;
    o.frequency.value=f*mult;
    o.detune.value=detune;
    g.gain.value=level;
    o.connect(g);g.connect(master);o.start();
    os.push(o);
  }

  if(sound==='piano'){
    addOsc('triangle',1,.78);
    addOsc('sine',2,.16);
    addOsc('sine',3,.06);
  }else if(sound==='softPiano'){
    addOsc('triangle',1,.9);
    addOsc('sine',2,.08);
    addOsc('sine',3,.025);
  }else if(sound==='rhodes'){
    addOsc('sine',1,.72);
    addOsc('triangle',2,.20);
    addOsc('sine',3,.05);
    addOsc('sine',1,.10,5);
  }else if(sound==='fm'){
    const carrier=ctx.createOscillator(),mod=ctx.createOscillator(),mg=ctx.createGain();
    carrier.type='sine';mod.type='sine';
    carrier.frequency.value=f;mod.frequency.value=f*2;
    mg.gain.value=f*.8;
    mod.connect(mg);mg.connect(carrier.frequency);
    carrier.connect(master);carrier.start();mod.start();
    os.push(carrier,mod);
  }else if(sound==='organ'){
    addOsc('sine',1,.65);
    addOsc('sine',2,.25);
    addOsc('sine',3,.14);
    addOsc('sine',4,.08);
  }else if(sound==='pad'){
    addOsc('sine',1,.55,-7);
    addOsc('triangle',1,.35,7);
    addOsc('sine',2,.12,-5);
  }else if(sound==='vibes'){
    addOsc('sine',1,.75);
    addOsc('sine',2,.18);
    addOsc('sine',3,.08);
  }else if(sound==='strings'){
    addOsc('sawtooth',1,.22,-6);
    addOsc('sawtooth',1,.22,6);
    addOsc('triangle',2,.10);
  }

  return {master,os,release};
}

async function start(key){
  await ensureAudio();
  const [deg,type]=map[key];
  stop(key);
  const f=flavorForKey(key);
  const voiced=voicedIntervals(intervals(deg,type,f)); const vs=voiced.map(i=>makeVoice(freq(rootMidi(deg)+i)));
  active.set(key,vs);
  document.querySelector(`[data-key="${key}"]`)?.classList.add('active');
  const s=+document.getElementById('sustainSelect').value;
  if(s>0)setTimeout(()=>stop(key),s*1000);
}
function stop(key){
  const vs=active.get(key);if(!vs)return;
  const now=ctx.currentTime;
  vs.forEach(v=>{
    v.master.gain.cancelScheduledValues(now);
    v.master.gain.setValueAtTime(Math.max(v.master.gain.value,.0001),now);
    v.master.gain.exponentialRampToValueAtTime(.0001,now+.3);
    v.os.forEach(o=>o.stop(now+.35));
  });
  active.delete(key);
  document.querySelector(`[data-key="${key}"]`)?.classList.remove('active');
}
function stopAll(){[...active.keys()].forEach(stop)}

function render(){
  const kb=document.getElementById('keyboard');kb.innerHTML='';
  rows.forEach(row=>{
    const r=document.createElement('div');r.className='row';
    row.forEach(key=>{
      const [deg,type]=map[key];
      const e=document.createElement('div');e.className='key';e.dataset.key=key;
      e.innerHTML=`<div class="keycap">${key.toUpperCase()}</div><div class="chord">${chordName(deg,type,key)}</div><div class="roman">${romanByType[key]}</div>`;
      e.addEventListener('pointerdown',ev=>{ev.preventDefault();start(key)});
      e.addEventListener('pointerup',()=>{if(+document.getElementById('sustainSelect').value===0)stop(key)});
      e.addEventListener('pointerleave',()=>{if(+document.getElementById('sustainSelect').value===0)stop(key)});
      r.appendChild(e);
    });
    kb.appendChild(r);
  });
}
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!e.repeat&&map[k]){e.preventDefault();start(k)}
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(map[k]&&+document.getElementById('sustainSelect').value===0)stop(k);
});
document.getElementById('keySelect').onchange=()=>{stopAll();window.lastVoicingCenter=null;render()};
document.getElementById('octaveSelect').onchange=stopAll;
document.getElementById('sustainSelect').onchange=stopAll;
document.getElementById('flavorSelect').onchange=()=>{document.getElementById('presetSelect').value='none';stopAll();render()};
document.getElementById('presetSelect').onchange=()=>{stopAll();render()};
document.getElementById('soundSelect').onchange=stopAll;
const themeBtn=document.getElementById('themeBtn');
let savedTheme='dark';
try{savedTheme=localStorage.getItem('oneKeyTheme')||'light'}catch(e){}
function applyTheme(theme){
  document.body.classList.toggle('dark-mode',theme==='dark');
  document.body.classList.toggle('light-mode',theme!=='dark');
  themeBtn.textContent=theme==='dark'?'☀ Light':'☾ Dark';
  try{localStorage.setItem('oneKeyTheme',theme)}catch(e){}
}
applyTheme(savedTheme);
themeBtn.addEventListener('click',()=>applyTheme(document.body.classList.contains('dark-mode')?'light':'dark'));

document.getElementById('stopBtn').onclick=stopAll;
document.getElementById('voicingSelect').onchange=()=>{stopAll();window.lastVoicingCenter=null;render()};
document.getElementById('fullscreenBtn').onclick=async()=>{
  try{
    if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}
    else{await document.exitFullscreen()}
  }catch(e){}
};
document.addEventListener('fullscreenchange',()=>{
  const on=!!document.fullscreenElement;
  document.body.classList.toggle('fullscreen',on);
  document.getElementById('fullscreenBtn').textContent=on?'⛶ Exit Full Screen':'⛶ Full Screen';
});

document.body.addEventListener('pointerdown',async()=>{
  await ensureAudio();
  document.getElementById('status').textContent='Sound enabled';
},{once:true});
render();
</script></body></html>
